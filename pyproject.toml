[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmcphi"
version = "0.1.0"
description = "The Phi layer: causal-cone freedom as a third factor in the Fractal Monte Carlo virtual reward"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]
stats = ["scipy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
